name: GitHub Pages

# Production: render the Quarto website in site/ and publish it to the root of
# the gh-pages branch, which GitHub Pages serves at
# https://UNECE.github.io/Statistical-Architecture-Framework/
# on every push to main (or manually via workflow_dispatch).
#
# Requires (one-time, in repo settings):
#   - Settings > Pages > Source = "Deploy from a branch", branch gh-pages (root /)
#   - Settings > Actions > General > Workflow permissions = "Read and write"
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

# Never let concurrent production deploys clobber each other.
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true   # PDF rendering: lualatex for the site's pdf: format (scrartcl)

      # The site has mermaid diagrams and a `pdf:` format, so PDF rendering needs
      # a headless Chromium. The GitHub ubuntu runner ships chromium but not all
      # of its runtime libraries; install them.
      - name: Install headless-chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 \
            libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 \
            libcups2 libdrm2 libdbus-1-3 libexpat1 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libxext6 libx11-6 libxcb1 \
            libgbm1 libpango-1.0-0 libcairo2 \
            libasound2t64 \
            fonts-liberation fonts-noto-color-emoji

      - name: Render Quarto website
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: site

      # Publish the rendered site to the root of gh-pages. clean: true prunes
      # stale production files, but clean-exclude keeps the per-PR preview
      # umbrella directory (pr-preview/) intact so in-flight previews survive.
      # force: false rebases rather than force-pushing, which also preserves
      # previews on the shared branch.
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site/_site
          clean: true
          clean-exclude: pr-preview
          force: false
