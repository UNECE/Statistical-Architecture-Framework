name: S3 Deploy

# Production: render the Quarto website in site/ and publish it to S3/MinIO at
# s3://h4njlg/saf/html/ on every push to main (or manually via workflow_dispatch).
# All S3 credentials come from repo secrets — nothing is hardcoded here.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/s3-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never let concurrent production deploys clobber each other.
concurrency:
  group: s3-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT_URL }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # "latest stable" Quarto, as chosen. No version pin.
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true   # PDF rendering: lualatex for the site's pdf: format (scrartcl)

      # The site has mermaid diagrams and a `pdf:` format, so PDF rendering needs
      # a headless Chromium. The GitHub ubuntu runner ships chromium but not all
      # of its runtime libraries; install them.
      - name: Install headless-chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 \
            libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 \
            libcups2 libdrm2 libdbus-1-3 libexpat1 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libxext6 libx11-6 libxcb1 \
            libgbm1 libpango-1.0-0 libcairo2 \
            libasound2t64 \
            fonts-liberation fonts-noto-color-emoji

      - name: Render Quarto website
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: site

      # Fail fast with a clear message if the secret lacks access to the prefix.
      - name: Check S3 access
        run: |
          set -euo pipefail
          if ! aws s3 ls "s3://${S3_BUCKET}/saf/html/" --endpoint-url "$S3_ENDPOINT"; then
            echo "::error::S3 access failed. Check that the S3_* secrets are set and that the key can list/write s3://${S3_BUCKET}/saf/html/ ."
            exit 1
          fi

      # --delete prunes stale production objects, but --exclude pr/* protects the
      # per-PR preview folders living under the same prefix.
      - name: Deploy to S3
        run: |
          aws s3 sync "site/_site/" "s3://${S3_BUCKET}/saf/html/" \
            --endpoint-url "$S3_ENDPOINT" \
            --delete --exclude "pr/*"
