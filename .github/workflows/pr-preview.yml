name: PR Preview

# Per-PR preview: render the Quarto website in site/ and publish it to
# gh-pages/pr-preview/pr-<n>/, which GitHub Pages serves at
# https://UNECE.github.io/Statistical-Architecture-Framework/pr-preview/pr-<n>/
# Posts a sticky preview URL comment on the PR and removes the folder when the
# PR is closed.
#
# Requires (one-time, in repo settings):
#   - Settings > Pages > Source = "Deploy from a branch", branch gh-pages (root /)
#   - Settings > Actions > General > Workflow permissions = "Read and write"
#
# Note: preview-pages does not support PRs opened from forks.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "site/**"
      - ".github/workflows/pr-preview.yml"

permissions:
  contents: write
  pull-requests: write

# One in-flight preview build per PR; a newer commit supersedes the older one.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true   # PDF rendering: lualatex for the site's pdf: format (scrartcl)

      # The site has mermaid diagrams and a `pdf:` format, so PDF rendering needs
      # a headless Chromium. The GitHub ubuntu runner ships chromium but not all
      # of its runtime libraries; install them.
      - name: Install headless-chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 \
            libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 \
            libcups2 libdrm2 libdbus-1-3 libexpat1 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libxext6 libx11-6 libxcb1 \
            libgbm1 libpango-1.0-0 libcairo2 \
            libasound2t64 \
            fonts-liberation fonts-noto-color-emoji

      - name: Render Quarto website
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: site

      # Publish this PR's preview to gh-pages/pr-preview/pr-<n>/. clean: false so
      # we never delete the production site or other PR previews; each PR writes
      # only into its own pr-<n> folder. pr-per-commit: false keeps one stable
      # URL per PR that updates on each new commit.
      - name: Deploy preview
        uses: rajyan/preview-pages@v1
        with:
          source-dir: site/_site
          target-branch: gh-pages
          target-dir: pr-preview
          pr-per-commit: false
          clean: false
          force: false
          pr-comment: sticky
          branch-comment: none

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview folder
        run: |
          set -uo pipefail
          if [ -d "pr-preview/pr-${{ github.event.number }}" ]; then
            rm -rf "pr-preview/pr-${{ github.event.number }}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Remove preview for PR ${{ github.event.number }}"
            git push
          else
            echo "No preview folder to remove for PR ${{ github.event.number }}."
          fi
