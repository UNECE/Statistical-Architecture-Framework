name: PR Preview

# Per-PR preview: render the Quarto website in site/ and publish it to
# s3://h4njlg/saf/html/pr/<n>/ (publicly readable). Posts a clickable preview
# URL on the PR and removes the prefix when the PR is closed.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "site/**"
      - ".github/workflows/pr-preview.yml"

permissions:
  contents: read
  pull-requests: write

# One in-flight preview build per PR; a newer commit supersedes the older one.
concurrency:
  group: s3-pr-${{ github.event.number }}
  cancel-in-progress: true

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: us-east-1
  S3_ENDPOINT: ${{ secrets.S3_ENDPOINT_URL }}
  S3_BUCKET: ${{ secrets.S3_BUCKET }}

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true   # PDF rendering: lualatex for the site's pdf: format (scrartcl)

      # The site has mermaid diagrams and a `pdf:` format, so PDF rendering needs
      # a headless Chromium. Install the runtime libraries (runner ships chromium).
      - name: Install headless-chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 \
            libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 \
            libcups2 libdrm2 libdbus-1-3 libexpat1 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libxext6 libx11-6 libxcb1 \
            libgbm1 libpango-1.0-0 libcairo2 \
            libasound2t64 \
            fonts-liberation fonts-noto-color-emoji

      - name: Render Quarto website
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: site

      # Replace this PR's preview folder on each commit.
      - name: Deploy preview to S3
        run: |
          aws s3 sync "site/_site/" "s3://${S3_BUCKET}/saf/html/pr/${{ github.event.number }}/" \
            --endpoint-url "$S3_ENDPOINT" \
            --delete

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const host = new URL(process.env.S3_ENDPOINT).host;
            const { owner, repo } = context.repo;
            const number = context.issue.number;
            const url = `https://${host}/${process.env.S3_BUCKET}/saf/html/pr/${number}/index.html`;
            const marker = "🔎 **PR preview**";
            const body =
              `${marker}\nLive preview: ${url}\n` +
              `_(publicly readable folder; updates on each commit to this PR)_`;
            const { data: comments } =
              await github.rest.issues.listComments({ owner, repo, issue_number: number });
            const existing = comments.find((c) =>
              String(c.body).includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove preview prefix
        run: |
          set -uo pipefail
          aws s3 rm --recursive "s3://${S3_BUCKET}/saf/html/pr/${{ github.event.number }}/" \
            --endpoint-url "$S3_ENDPOINT"
          echo "Removed s3://${S3_BUCKET}/saf/html/pr/${{ github.event.number }}/ (if it existed)."
