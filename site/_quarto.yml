project:
  type: website
  output-dir: _site
  # framework/*.qmd (except index.qmd) are generated from docs/SAF Framework.md
  pre-render: python3 scripts/split-framework.py

website:
  title: "Statistical Architecture Framework"
  navbar:
    background: light
    search: true
  sidebar:
    style: floating
    collapse-level: 1
    contents:
      - index.qmd
      - SAF-in-Brief.qmd
      - SAF-Getting-Started.qmd
      - section: "Framework"
        href: framework/index.qmd
        contents:
          - section: "Foundations"
            contents:
              - framework/introduction.qmd
              - framework/motivation.qmd
              - framework/strategy.qmd
          - section: "Business architecture"
            contents:
              - framework/business-architecture.qmd
              - framework/steady-states.qmd
              - framework/value-chain.qmd
          - section: "Production value streams"
            contents:
              - framework/vs-01.qmd
              - framework/vs-02.qmd
              - framework/vs-03.qmd
              - framework/vs-04.qmd
              - framework/vs-05.qmd
              - framework/vs-06.qmd
          - section: "Supporting value streams"
            contents:
              - framework/vs-07.qmd
              - framework/vs-08.qmd
              - framework/vs-09.qmd
              - framework/vs-10.qmd
      - glossary.qmd
      - open-source.qmd
      - downloads.qmd
  page-navigation: true

format:
  html:
    theme: [cosmo, custom.scss]
    grid:
      sidebar-width: 270px
      body-width: 820px
      margin-width: 230px
    filters:
      - table-scroll.lua
    include-after-body: saf-ids.html
    toc: true
    toc-depth: 3
    toc-expand: 2
    number-sections: false
    code-copy: false
    mermaid:
      theme: neutral
  pdf:
    documentclass: scrartcl
    papersize: a4
    geometry:
      - margin=2.4cm
    fontsize: 10pt
    toc: true
    toc-depth: 3
    number-sections: false
    colorlinks: true
    linkcolor: "RoyalBlue"
    mermaid:
      theme: neutral
    urlcolor: "RoyalBlue"
    filters:
      - pdf-links.lua

lang: en
